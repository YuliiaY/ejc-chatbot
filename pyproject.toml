[project]
name = "ejc-bot"
version = "0.1.0"
description = "Local-LLM assistant for the European Juggling Convention: RAG over EJA/EJC websites, schedule search and an organizer knowledge agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "chainlit>=2.11.1",
    "crawl4ai>=0.9.2",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "requests>=2.34.2",
]

[project.scripts]
ejc-ingest-web = "ejc_bot.ingest.web:main"
ejc-ingest-schedule = "ejc_bot.ingest.schedule:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ejc_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
